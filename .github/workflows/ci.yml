name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-web:
    name: 网页构建验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生产构建
        run: npm run build

  check-tauri:
    # 两个平台都编一遍。发版时才发现 macOS 编不过,意味着 tag 已经打出去了
    name: 桌面端编译检查(${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - name: 安装依赖
        run: npm ci

      - name: Rust 编译检查
        run: cargo check --manifest-path src-tauri/Cargo.toml
